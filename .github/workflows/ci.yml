name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the automatic GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # Installs exactly what package-lock.json records (integrity-checked).
      - run: npm ci

      - name: Known vulnerabilities (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
